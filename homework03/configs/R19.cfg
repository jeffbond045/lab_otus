
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R19
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
! Local authentication entry omitted from publication.
!
redundancy
!
!
ip ssh version 2
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.10.255.19 255.255.255.255
 ip ospf 1 area 101
!
interface Ethernet0/0
 no shutdown
 description P2P_to_R14_e0/3
 ip address 10.10.200.77 255.255.255.252
 ip ospf network point-to-point
!
interface Ethernet0/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet0/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet0/3
 no shutdown
 no ip address
 shutdown
!
router ospf 1
 router-id 19.19.19.19
 area 101 stub
 network 10.10.200.76 0.0.0.3 area 101
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
 terminal-type monitor
line aux 0
line vty 0 4
 exec-timeout 30 0
 logging synchronous
 login local
 transport input telnet ssh
!
!
end
