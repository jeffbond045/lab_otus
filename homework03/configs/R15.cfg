
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R15
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
! Local authentication entry omitted from publication.
!
redundancy
!
!
ip ssh version 2
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.10.255.15 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 no shutdown
 description P2P_to_R13_e0/2
 ip address 10.10.200.70 255.255.255.252
 ip ospf network point-to-point
!
interface Ethernet0/1
 no shutdown
 description P2P_to_R12_e0/3
 ip address 10.10.200.82 255.255.255.252
 ip ospf network point-to-point
!
interface Ethernet0/2
 no shutdown
 description P2P_to_LAMAS_R21_e0/0
 ip address 172.20.20.5 255.255.255.252
!
interface Ethernet0/3
 no shutdown
 description P2P_to_R20_e0/0
 ip address 10.10.200.74 255.255.255.252
 ip ospf network point-to-point
!
interface Ethernet1/0
 no shutdown
 description description P2P_to_R14_e1/0
 ip address 10.10.200.90 255.255.255.252
 ip ospf network point-to-point
!
interface Ethernet1/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/3
 no shutdown
 no ip address
 shutdown
!
router ospf 1
 router-id 15.15.15.15
 area 10 stub
 area 102 filter-list prefix FILTER_IP_FROM_AREA101 in
 network 10.10.200.68 0.0.0.3 area 10
 network 10.10.200.72 0.0.0.3 area 102
 network 10.10.200.80 0.0.0.3 area 10
 network 10.10.200.88 0.0.0.3 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 172.20.20.6
!
!
ip prefix-list FILTER_IP_FROM_AREA101 seq 20 deny 10.10.200.76/30
ip prefix-list FILTER_IP_FROM_AREA101 seq 21 deny 10.10.255.19/32
ip prefix-list FILTER_IP_FROM_AREA101 seq 30 permit 0.0.0.0/0 le 32
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 30 0
 logging synchronous
 login local
 length 0
 transport input telnet ssh
!
!
end
