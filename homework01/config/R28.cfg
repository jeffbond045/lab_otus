
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R28
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username evgeny privilege 15 secret 5 $1$cKfA$VdVy2WLdQbCh013Muo4Hv.
!
redundancy
!
!
ip ssh version 2
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.30.255.28 255.255.255.255
!
interface Ethernet0/0
 no shutdown
 description P2P_to_R26_e0/1
 ip address 172.20.20.30 255.255.255.252
!
interface Ethernet0/1
 no shutdown
 description P2P_to_R25_e0/3
 ip address 172.20.20.34 255.255.255.252
!
interface Ethernet0/2
 no shutdown
 description to_SW29_e0/2
 no ip address
!
interface Ethernet0/2.10
 no shutdown
 encapsulation dot1Q 10
 ip address 192.168.30.1 255.255.255.0
!
interface Ethernet0/2.20
 no shutdown
 encapsulation dot1Q 20
 ip address 192.168.31.1 255.255.255.0
!
interface Ethernet0/2.99
 no shutdown
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
!
interface Ethernet0/3
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/0
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/3
 no shutdown
 no ip address
 shutdown
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip access-list extended VLAN10_IN
 deny   ip 192.168.30.0 0.0.0.255 192.168.31.0 0.0.0.255
 permit ip any any
ip access-list extended VLAN20_IN
 deny   ip 192.168.31.0 0.0.0.255 192.168.30.0 0.0.0.255
 permit ip any any
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 30 0
 logging synchronous
 login local
 transport input telnet ssh
!
!
end
