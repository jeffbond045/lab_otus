
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R13
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username evgeny privilege 15 secret 5 $1$DOEo$ZxGOqrc3xJmQ/cks/nJzC0
!
redundancy
!
!
ip ssh version 2
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.10.255.13 255.255.255.252
!
interface Ethernet0/0
 no shutdown
 ip address 10.10.200.6 255.255.255.252
!
interface Ethernet0/1
 no shutdown
 description P2P_to_SW4_e1/1
 ip address 10.10.200.14 255.255.255.252
!
interface Ethernet0/2
 no shutdown
 description P2P_to_R15_e0/0
 ip address 10.10.200.69 255.255.255.252
!
interface Ethernet0/3
 no shutdown
 description P2P_to_R14_e0/1
 ip address 10.10.200.85 255.255.255.252
!
interface Ethernet1/0
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/3
 no shutdown
 no ip address
 shutdown
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 40 0
 logging synchronous
line aux 0
line vty 0 4
 login local
 transport input telnet ssh
!
!
end
